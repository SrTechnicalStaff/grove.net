<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trace — Presence Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/grid.css">

</head>
<body>

  <div id="viewport" class="viewport">
    <div id="watermark" class="watermark" onclick="startRenameLayer()"><span id="wkname" class="wk-name">Field Notes</span><span id="wknum" class="wk-num">01</span></div>
    <div class="layerchip"></div>
    <div id="selcount" class="selcount"></div>
    <div id="layerrename" class="layerrename"><input id="layerrenameinput" type="text" placeholder="Layer name" spellcheck="false"></div>
    <div id="world" class="world">
      <div id="cells"></div>
      <div id="trail"></div>
      <div id="objs"></div>
      <div id="ghost" class="ghost"><span class="glabel"></span></div>
      <div id="marquee" class="marquee"></div>
    </div>
  </div>

  <div id="hud" class="hud" style="display:none !important">
    <div class="hud-head"><span>Controls</span><button id="hudClose" class="hud-x" aria-label="Hide">×</button></div>
    <div class="hud-mouserow">
      <svg width="46" height="64" viewBox="0 0 46 64" aria-hidden="true">
        <path d="M23 4 A19 19 0 0 0 4 23 V26 H23 Z" fill="#5b5288" opacity="0.55"/>
        <path d="M23 4 A19 19 0 0 1 42 23 V26 H23 Z" fill="#7a3f3a" opacity="0.55"/>
        <rect x="20.5" y="9" width="5" height="13" rx="2.5" fill="#3f5f8a"/>
        <rect x="4" y="4" width="38" height="56" rx="19" fill="none" stroke="#3a3a40" stroke-width="1.3"/>
        <line x1="4" y1="26" x2="42" y2="26" stroke="#2c2c32" stroke-width="1"/>
        <line x1="23" y1="4" x2="23" y2="26" stroke="#2c2c32" stroke-width="1"/>
      </svg>
      <div class="hud-mlabels">
        <div><span class="dot" style="background:#b3a9e0"></span>Left — create · select · move</div>
        <div><span class="dot" style="background:#9bb6e0"></span>Wheel — zoom · press = pan</div>
        <div><span class="dot" style="background:#e0a9a3"></span>Right — remove</div>
      </div>
    </div>
    <div class="hud-keys">
      <div class="kc"><span class="cap k-slate">Space</span><span class="cap-t">memories slate · 25/50/100 inside</span></div>
      <div class="kc"><span class="cap k-tool">Tab</span><span class="cap-t">cycle tool</span><span class="cap k-tool" style="margin-left:10px">1</span><span class="cap k-tool">2</span><span class="cap k-tool">3</span><span class="cap-t">note colour</span></div>
      <div class="kc"><span class="cap k-tool">Esc</span><span class="cap-t">neutral</span><span class="cap k-view" style="margin-left:10px">F</span><span class="cap-t">frame</span><span class="cap k-edit" style="margin-left:10px">Del</span><span class="cap-t">remove</span></div>
      <div class="kc"><span class="cap k-layer">[</span><span class="cap k-layer">]</span><span class="cap-t">layer</span><span class="cap k-layer" style="margin-left:8px">⌃[</span><span class="cap k-layer">⌃]</span><span class="cap-t">bring item</span></div>
    </div>
    <div class="hud-hint">press <b>?</b> to hide · <b>Space</b> opens memories</div>
  </div>
  <button id="hudPip" class="hud-pip" style="display:none !important" title="Controls (?)">?</button>

  <div id="slate" class="slate" aria-hidden="true">
    <div id="slateScrim" class="slate-scrim"></div>
    <div id="slatePanel" class="slate-panel half">
      <div class="slate-bar">
        <div class="slate-forms">
          <button data-form="rail">25</button><button data-form="half">50</button><button data-form="full">100</button>
        </div>
        <div class="slate-search">
          <svg viewBox="0 0 24 24" width="15" height="15" style="stroke:#7a7a80;fill:none;stroke-width:1.7;flex:none"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
          <input id="slateInput" type="text" placeholder="Search memories — or type a note, press Enter" spellcheck="false">
          <button class="slate-ico" id="slateAdd" title="Add note"><svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
        </div>
        <div class="slate-meta" id="slateMeta">0 memories</div>
      </div>
      <div id="slateGrid" class="slate-grid"></div>
    </div>
  </div>

  <script src="js/grid.js"></script>

</body>
</html>
